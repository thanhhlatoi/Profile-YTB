[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome-profile-manager"
version = "0.1.0"
description = "Ubuntu desktop manager for isolated Chrome profiles"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "SQLAlchemy>=2.0",
  "pydantic>=2.5",
  "psutil>=5.9",
  "websocket-client>=1.6",
  "mcp>=2.3,<3",
  "APScheduler>=3.10",
  "platformdirs>=4.0",
]

[project.scripts]
chrome-profile-manager = "app.main:main"
cpm = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["studio_js/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
